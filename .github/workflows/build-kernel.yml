name: Build gauguin kernel

on:
  workflow_dispatch:
  schedule:
    # Cada jueves a las 04:00 UTC (cada 7 días desde hoy, 27 ago 2026)
    - cron: '0 4 * * 4'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source (LineageOS upstream)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_gauguin
          ref: lineage-23.2

      - name: Aplicar fix de congelación de batería (baterías no-OEM)
        run: |
          set -eo pipefail
          FILE=drivers/power/supply/qcom/qpnp-qg.c
          ORIG='chip->batterysecret_support = of_property_read_bool(node, "qcom,batterysecret-support");'
          if ! grep -qF "$ORIG" "$FILE"; then
            echo "::error::No se encontró la línea original de batterysecret_support en $FILE."
            echo "::error::LineageOS puede haber modificado esta parte del driver — revisa y actualiza el parche a mano."
            exit 1
          fi
          sed -i "s|${ORIG}|chip->batterysecret_support = false; /* forzado: evita freeze de SOC con baterías no-OEM, bypass autenticación 1-Wire OEM */|" "$FILE"
          # Verificación: confirmar que el cambio realmente se aplicó
          if grep -qF "$ORIG" "$FILE"; then
            echo "::error::El parche no se aplicó correctamente (la línea original sigue presente)."
            exit 1
          fi
          echo "Parche de batería aplicado correctamente."

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libncurses-dev \
            libelf-dev dwarves device-tree-compiler python3 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            cpio rsync wget xz-utils zip

      - name: Download Clang prebuilt (r547379)
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang.tar.gz
          mkdir -p clang-r547379
          tar -xzf clang.tar.gz -C clang-r547379
          rm clang.tar.gz

      - name: Download GCC prebuilt (4.9)
        run: |
          cd $HOME/toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-prebuilt

      - name: Configure kernel
        run: |
          set -eo pipefail
          export ARCH=arm64
          export CLANG_DIR=$HOME/toolchain/clang-r547379
          export PATH=$CLANG_DIR/bin:$HOME/toolchain/gcc-prebuilt/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-

          mkdir -p out
          scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/vendor/lito-perf_defconfig \
            arch/arm64/configs/vendor/xiaomi/gauguin.config
          make O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel
        run: |
          set -eo pipefail
          export ARCH=arm64
          export CLANG_DIR=$HOME/toolchain/clang-r547379
          export PATH=$CLANG_DIR/bin:$HOME/toolchain/gcc-prebuilt/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          # Compilamos Image.gz-dtb y también dtbo.img (si el árbol lo genera)
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error=undef" \
            Image.gz-dtb dtbo.img 2>&1 | tee build.log || \
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error=undef" \
            Image.gz-dtb 2>&1 | tee build.log

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3

          cat > anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=Gauguin Kernel (LineageOS based)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gauguin
          device.name2=gauguinpro
          device.name3=gauguininpro
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          # install
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=gzip;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ## boot install
          dump_boot;
          patch_cmdline "skip_initramfs" "want_initramfs";
          write_boot;
          ## end boot install

          ## dtbo install (solo si existe dtbo.img)
          if [ -f $home/dtbo.img ]; then
            flash_dtbo;
          fi
          ## end dtbo install
          EOF

          rm -rf .git README.md

      - name: Package AnyKernel3 zip
        run: |
          # Copiar imagen del kernel
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "ERROR: No se encontró ninguna imagen del kernel"
            exit 1
          fi

          # Copiar dtbo.img si existe (no falla si no está)
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
            echo "dtbo.img incluido"
          else
            echo "No se generó dtbo.img (se omite, es normal en muchos builds)"
          fi

          cd AnyKernel3
          zip -r9 ../Gauguin-Kernel-$(date +%Y%m%d-%H%M).zip * -x "*.git*" "*README*"
          cd ..
          ls -lh Gauguin-Kernel-*.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload kernel image (raw)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: Gauguin-Kernel-AnyKernel3
          path: Gauguin-Kernel-*.zip
